<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fashion Store</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Fashion Store</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#products">Products</a>
      <a href="#cart">Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </header>

  <section id="home">
    <h2>Welcome to Our Fashion Store</h2>
    <p>Trendy T-Shirts, Hoodies, and more!</p>
  </section>

  <section id="products">
    <h2>Our Products</h2>
    <div class="product-grid">
      <div class="product">
        <img src="https://via.placeholder.com/150" alt="T-Shirt">
        <h3>Classic T-Shirt</h3>
        <p>₹500</p>
        <button onclick="addToCart('Classic T-Shirt', 500)">Add to Cart</button>
      </div>
      <div class="product">
        <img src="https://via.placeholder.com/150" alt="Hoodie">
        <h3>Winter Hoodie</h3>
        <p>₹1,200</p>
        <button onclick="addToCart('Winter Hoodie', 1200)">Add to Cart</button>
      </div>
      <div class="product">
        <img src="https://via.placeholder.com/150" alt="Jeans">
        <h3>Blue Jeans</h3>
        <p>₹1,000</p>
        <button onclick="addToCart('Blue Jeans', 1000)">Add to Cart</button>
      </div>
    </div>
  </section>

  <section id="cart">
    <h2>Your Cart</h2>
    <ul id="cart-items"></ul>
    <p>Total: ₹<span id="total">0</span></p>
  </section>
</body>
</html>
